name: Chinese patch native verification
on:
  push:
    branches: [zh-cn]
    paths: ['tools/zh-cn/**', '.github/workflows/zh-ci.yml']
  pull_request:
    branches: [zh-cn]
    paths: ['tools/zh-cn/**', '.github/workflows/zh-ci.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate:
        type: boolean
        default: false
      commit:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: zh-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tools/zh-cn
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.candidate
        with:
          name: zh-candidate
          path: tools/zh-cn/work/candidate
      - name: Check out the prepared candidate
        if: inputs.candidate
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
        run: |
          git fetch work/candidate/candidate.bundle zh-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE_COMMIT"
          git checkout --detach "$CANDIDATE_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci --ignore-scripts
      - run: node --test test.mjs
      - run: python ci/prepare.py
      - name: Build native patch executable
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then npm run build:win; else npm run build:mac; fi
      - name: Verify original and translated applications, signing, and restore
        run: node ci/verify.mjs
      - name: Verify corruption, version guards, and unchanged archive content
        run: node ci/integration.mjs
      - name: Package verified executable
        run: python ci/package.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zh-${{ matrix.os }}
          path: tools/zh-cn/artifacts/
          if-no-files-found: warn
